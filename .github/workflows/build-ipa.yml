name: Build VoiceReader IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build unsigned app (iphoneos)
        working-directory: native
        run: |
          set -euo pipefail
          xcodebuild \
            -project VoiceReader.xcodeproj \
            -target VoiceReader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        working-directory: native
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/VoiceReader.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Built app not found at $APP"
            find build/Build/Products -maxdepth 3 -type d || true
            exit 1
          fi
          rm -rf packaging
          mkdir -p packaging/Payload
          cp -R "$APP" packaging/Payload/VoiceReader.app
          cd packaging
          zip -qry ../VoiceReader-unsigned.ipa Payload
          cd ..
          ls -lh VoiceReader-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceReader-unsigned-ipa
          path: native/VoiceReader-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
